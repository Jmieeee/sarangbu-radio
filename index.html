<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사랑부 보이는 라디오 📻 LIVE</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #0d0f18;
            --card-bg: #161b26;
            --accent-pink: #ff2a74;
            --accent-cyan: #00f2fe;
            --accent-gold: #ffb703;
            --text-main: #ffffff;
            --text-sub: #a0a8c0;
            --danger-color: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard Variable", sans-serif; }
        
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 42, 116, 0.2) 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, rgba(0, 242, 254, 0.15) 0%, transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 42, 116, 0.25);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            position: relative;
        }

        .header {
            background: #090c13;
            padding: 25px 20px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .on-air-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 42, 116, 0.15);
            color: var(--accent-pink);
            border: 1px solid var(--accent-pink);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            box-shadow: 0 0 12px rgba(255, 42, 116, 0.5);
        }

        .on-air-dot {
            width: 8px; height: 8px;
            background-color: var(--accent-pink);
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .header h1 {
            font-size: 1.65rem; font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .radio-freq {
            font-size: 0.85rem; color: var(--accent-gold);
            margin-top: 4px; font-weight: 600; letter-spacing: 1px;
        }

        .content { padding: 22px; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-weight: 600; margin-bottom: 8px;
            font-size: 0.9rem; color: var(--text-sub);
        }

        .form-group input {
            width: 100%; padding: 15px;
            background: rgba(0, 0, 0, 0.35);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px; font-size: 1rem; color: #fff; outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 12px rgba(255, 42, 116, 0.4);
        }

        .radio-display-box {
            background: #06080e;
            border: 2px solid rgba(0, 242, 254, 0.4);
            border-radius: 20px; padding: 20px;
            text-align: center; margin-bottom: 20px;
            min-height: 250px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 242, 254, 0.15);
            position: relative;
            overflow: hidden;
        }

        .btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, var(--accent-pink), #e01e5a);
            color: white; border: none; border-radius: 14px;
            font-size: 1.05rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 42, 116, 0.4);
            transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); }

        .draw-mode-select {
            display: flex; gap: 6px; margin-bottom: 15px;
            overflow-x: auto; padding-bottom: 6px;
        }
        .draw-mode-select::-webkit-scrollbar { height: 4px; }
        .draw-mode-select::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .mode-btn {
            flex: 0 0 auto; padding: 10px 14px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            color: var(--text-sub); font-size: 0.82rem; cursor: pointer; font-weight: 600;
            transition: all 0.2s; white-space: nowrap;
        }

        .mode-btn.active {
            background: rgba(0, 242, 254, 0.15); border-color: var(--accent-cyan);
            color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .result-card {
            display: none; background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--accent-gold); border-radius: 18px;
            padding: 20px; text-align: center; margin-top: 15px;
            box-shadow: 0 0 30px rgba(255, 183, 3, 0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.7) translateY(10px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .youtube-btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; background: #ff0000; color: white; text-decoration: none;
            padding: 12px 20px; border-radius: 25px; font-weight: bold; width: 100%; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
        }

        .slot-text {
            font-size: 2.1rem; font-weight: 900; color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(255, 183, 3, 0.8);
            animation: slotBounce 0.12s infinite alternate;
        }

        @keyframes slotBounce {
            0% { transform: translateY(-6px) scale(0.96); filter: blur(1px); }
            100% { transform: translateY(6px) scale(1.04); filter: blur(0px); }
        }

        .countdown-num {
            font-size: 5.5rem; font-weight: 900; color: var(--accent-pink);
            text-shadow: 0 0 35px var(--accent-pink), 0 0 10px #fff;
            animation: zoomPulse 0.9s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes zoomPulse {
            0% { transform: scale(0.4); opacity: 0.1; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .lp-record {
            width: 100px; height: 100px; border-radius: 50%;
            background: radial-gradient(circle, #333 15%, #111 16%, #222 35%, #000 36%, #111 70%);
            border: 4px solid var(--accent-gold);
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.5);
            animation: spin 0.25s linear infinite;
            display: flex; justify-content: center; align-items: center; margin-bottom: 12px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .radar-box {
            width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid var(--accent-cyan);
            position: relative; margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            overflow: hidden;
        }
        .radar-sweep {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: conic-gradient(from 0deg, transparent 0deg, transparent 270deg, rgba(0, 242, 254, 0.6) 360deg);
            animation: spin 1s linear infinite;
            border-radius: 50%;
        }

        .eq-bar-container {
            display: flex; gap: 4px; align-items: flex-end; height: 30px; margin-top: 10px;
        }
        .eq-bar {
            width: 6px; background: var(--accent-pink); border-radius: 3px;
            animation: eqAnim 0.3s ease infinite alternate;
        }
        @keyframes eqAnim { 0% { height: 5px; } 100% { height: 28px; } }

        .yt-thumbnail-wrapper {
            width: 100%;
            height: 185px;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .yt-thumbnail-img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .yt-play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35);
            display: flex; justify-content: center; align-items: center;
            transition: background 0.3s;
        }
        .yt-play-overlay:hover { background: rgba(0, 0, 0, 0.1); }

        .yt-play-icon {
            font-size: 3.2rem; color: #ff0000;
            filter: drop-shadow(0 0 12px rgba(0,0,0,0.9));
        }

        .story-list-container {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 15px;
            max-height: 250px; overflow-y: auto;
        }

        .story-list-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.95rem; font-weight: 700; color: var(--accent-cyan);
        }

        .story-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
            font-size: 0.88rem;
        }

        .story-item.drawn {
            opacity: 0.5; background: rgba(0, 0, 0, 0.4); border-style: dashed;
        }

        .story-info { flex: 1; margin-right: 10px; }
        .story-info .nick { font-weight: bold; color: #fff; }
        .story-info .song { color: var(--text-sub); font-size: 0.8rem; margin-top: 2px; }
        .drawn-tag {
            font-size: 0.75rem; background: rgba(255, 183, 3, 0.2); color: var(--accent-gold);
            padding: 2px 6px; border-radius: 4px; margin-left: 6px; border: 1px solid var(--accent-gold);
        }

        .delete-btn {
            background: rgba(255, 71, 87, 0.2); color: var(--danger-color);
            border: 1px solid var(--danger-color); border-radius: 6px;
            padding: 5px 10px; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
        }
        .delete-btn:hover { background: var(--danger-color); color: #fff; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        window.__FIREBASE_CONFIG__ = {
            apiKey: "AIzaSyBtWSnBN89ZmA9H7jjMx06fHE650b7CT-A",
            authDomain: "sarangbuvisualradio.firebaseapp.com",
            databaseURL: "https://sarangbuvisualradio-default-rtdb.firebaseio.com",
            projectId: "sarangbuvisualradio",
            storageBucket: "sarangbuvisualradio.firebasestorage.app",
            messagingSenderId: "577953137544",
            appId: "1:577953137544:web:423712a3f3491866fc703d",
            measurementId: "G-76RPNG3JKL"
        };

        const app = initializeApp(window.__FIREBASE_CONFIG__);
        const db = getDatabase(app);

        const storiesRef = ref(db, 'stories');
        const currentStateRef = ref(db, 'state/current');

        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode'); 

        let localStories = [];
        let selectedDrawMode = 'freq';

        function getYoutubeThumbnail(url) {
            if (!url) return 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop';
            let videoId = "";
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);

            if (match && match[2].length === 11) {
                videoId = match[2];
                return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            }
            return 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop';
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (mode === 'admin') {
                document.getElementById('adminMainSection').classList.add('active');
                initAdminMode();
            } else if (mode === 'display') {
                document.getElementById('displaySection').classList.add('active');
                initDisplayMode();
            } else {
                document.getElementById('userSection').classList.add('active');
            }
        });

        window.setDrawMode = function(modeName, btnElement) {
            selectedDrawMode = modeName;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        };

        window.submitStory = function(e) {
            e.preventDefault();
            const nickname = document.getElementById('nickname').value.trim();
            const songTitle = document.getElementById('songTitle').value.trim();
            const youtubeUrl = document.getElementById('youtubeUrl').value.trim();

            push(storiesRef, {
                nickname,
                songTitle,
                youtubeUrl,
                isDrawn: false,
                createdAt: Date.now()
            }).then(() => {
                document.getElementById('storyForm').style.display = 'none';
                document.getElementById('submittedCard').style.display = 'block';
            });
        };

        function runDrawAnimation(containerId, drawMode) {
            const container = document.getElementById(containerId);
            let timer = null;

            if (drawMode === 'freq') {
                timer = setInterval(() => {
                    const freq = (Math.random() * (107.9 - 88.1) + 88.1).toFixed(1);
                    container.innerHTML = `
                        <i class="fa-solid fa-radio fa-bounce" style="font-size:3rem; color:var(--accent-pink); margin-bottom:12px;"></i>
                        <div style="font-size:2.5rem; font-weight:900; color:var(--accent-cyan); text-shadow:0 0 15px var(--accent-cyan);">📻 FM ${freq} MHz</div>
                        <p style="color:var(--text-sub); margin-top:8px; font-size:0.9rem;">주파수 신호 검색 중...</p>
                    `;
                }, 70);
            } else if (drawMode === 'slot') {
                timer = setInterval(() => {
                    const randIdx = Math.floor(Math.random() * (localStories.length || 1));
                    const tempName = localStories[randIdx]?.nickname || "행운의 주인공";
                    const tempSong = localStories[randIdx]?.songTitle || "신청곡 탐색 중";
                    container.innerHTML = `
                        <div class="slot-text">🎰 ${tempName} 님</div>
                        <div style="color:var(--accent-cyan); font-size:1.1rem; font-weight:bold; margin-top:8px;">🎵 ${tempSong}</div>
                    `;
                }, 80);
            } else if (drawMode === 'countdown') {
                let count = 5;
                container.innerHTML = `<div class="countdown-num">${count}</div>`;
                timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        container.innerHTML = `<div class="countdown-num">${count}</div>`;
                    } else {
                        container.innerHTML = `
                            <i class="fa-solid fa-star fa-spin" style="font-size:3rem; color:var(--accent-gold); margin-bottom:10px;"></i>
                            <div style="font-size:2.2rem; font-weight:900; color:var(--accent-gold);">✨ 당첨자 발표! ✨</div>
                        `;
                    }
                }, 1000);
            } else if (drawMode === 'vinyl') {
                timer = setInterval(() => {
                    const randIdx = Math.floor(Math.random() * (localStories.length || 1));
                    const tempSong = localStories[randIdx]?.songTitle || "LP 트랙 탐색 중";
                    container.innerHTML = `
                        <div class="lp-record"><i class="fa-solid fa-music" style="color:var(--accent-gold); font-size:1.8rem;"></i></div>
                        <div style="font-size:1.2rem; font-weight:bold; color:#fff;">💿 LP 회전 중...</div>
                        <div style="color:var(--accent-pink); font-size:0.9rem; margin-top:4px;">${tempSong}</div>
                    `;
                }, 90);
            } else if (drawMode === 'radar') {
                timer = setInterval(() => {
                    const randIdx = Math.floor(Math.random() * (localStories.length || 1));
                    const tempName = localStories[randIdx]?.nickname || "스캐닝 중...";
                    container.innerHTML = `
                        <div class="radar-box"><div class="radar-sweep"></div></div>
                        <div style="font-size:1.2rem; font-weight:bold; color:var(--accent-cyan);">⚡ [SEARCHING] ${tempName}</div>
                        <div class="eq-bar-container">
                            <div class="eq-bar" style="animation-delay:0.1s;"></div>
                            <div class="eq-bar" style="animation-delay:0.3s;"></div>
                            <div class="eq-bar" style="animation-delay:0.2s;"></div>
                            <div class="eq-bar" style="animation-delay:0.4s;"></div>
                            <div class="eq-bar" style="animation-delay:0.15s;"></div>
                        </div>
                    `;
                }, 100);
            }
            return timer;
        }

        function initAdminMode() {
            let adminInterval = null;

            onValue(storiesRef, (snapshot) => {
                const data = snapshot.val();
                localStories = [];
                const storyListEl = document.getElementById('adminStoryList');
                storyListEl.innerHTML = '';

                if (data) {
                    Object.keys(data).forEach(key => {
                        localStories.push({ id: key, ...data[key] });
                    });
                }

                const undrawnList = localStories.filter(s => !s.isDrawn);
                document.getElementById('storyCount').innerText = localStories.length;
                document.getElementById('undrawnCount').innerText = undrawnList.length;

                if (localStories.length === 0) {
                    storyListEl.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:15px; font-size:0.85rem;">접수된 사연이 없습니다.</div>';
                    return;
                }

                [...localStories].reverse().forEach(story => {
                    const item = document.createElement('div');
                    item.className = `story-item ${story.isDrawn ? 'drawn' : ''}`;
                    item.innerHTML = `
                        <div class="story-info">
                            <div class="nick">
                                ${story.nickname} 
                                ${story.isDrawn ? '<span class="drawn-tag">추첨완료</span>' : ''}
                            </div>
                            <div class="song">🎵 ${story.songTitle}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteStory('${story.id}')"><i class="fa-solid fa-trash"></i> 삭제</button>
                    `;
                    storyListEl.appendChild(item);
                });
            });

            onValue(currentStateRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 타임스탬프 검증 (10초 이상 지난 과거 상태는 자동 실행 방지)
                const isRecent = data.timestamp && (Date.now() - data.timestamp < 10000);

                const displayBox = document.getElementById('adminDisplayBox');

                if (data.status === 'drawing' && isRecent) {
                    if (adminInterval) clearInterval(adminInterval);
                    document.getElementById('adminResultCard').style.display = 'none';
                    adminInterval = runDrawAnimation('adminDisplayBox', data.drawMode);
                } else if (data.status === 'completed' && data.winner) {
                    if (adminInterval) clearInterval(adminInterval);

                    const thumbUrl = getYoutubeThumbnail(data.winner.youtubeUrl);

                    displayBox.innerHTML = `
                        <a href="${data.winner.youtubeUrl}" target="_blank" style="width:100%; text-decoration:none;">
                            <div class="yt-thumbnail-wrapper">
                                <img src="${thumbUrl}" class="yt-thumbnail-img" alt="유튜브 썸네일">
                                <div class="yt-play-overlay">
                                    <i class="fa-brands fa-youtube yt-play-icon"></i>
                                </div>
                            </div>
                        </a>
                        <div style="font-size:1.4rem; font-weight:bold; color:var(--accent-gold);">🎉 ${data.winner.nickname} 님 당첨!</div>
                        <div style="color:#fff; margin-top:4px; font-size:0.95rem;">🎵 ${data.winner.songTitle}</div>
                    `;

                    document.getElementById('adminWinnerUser').innerText = `🎙️ 당첨자: ${data.winner.nickname} 님`;
                    document.getElementById('adminWinnerSong').innerText = `🎵 신청곡: ${data.winner.songTitle}`;
                    document.getElementById('adminWinnerYoutube').href = data.winner.youtubeUrl;
                    document.getElementById('adminResultCard').style.display = 'block';

                    if (isRecent) {
                        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    }
                } else {
                    if (adminInterval) clearInterval(adminInterval);
                    displayBox.innerHTML = `
                        <i class="fa-solid fa-sliders" style="font-size: 2.2rem; color: var(--accent-pink);"></i>
                        <p style="margin-top: 10px; font-size: 1.05rem; font-weight: 600;">메인 DJ 추첨 콘솔</p>
                        <p style="color:var(--text-sub); font-size:0.8rem; margin-top:4px;">위 연출을 선택 후 하단 버튼을 클릭하세요 (5초 연출)</p>
                    `;
                }
            });
        }

        window.deleteStory = function(storyId) {
            if (confirm("이 사연을 삭제하시겠습니까?")) {
                const singleStoryRef = ref(db, `stories/${storyId}`);
                remove(singleStoryRef);
            }
        };

        window.resetDrawnStatus = function() {
            if (confirm("모든 사연의 추첨 완료 상태를 초기화하시겠습니까?")) {
                localStories.forEach(story => {
                    update(ref(db, `stories/${story.id}`), { isDrawn: false });
                });
            }
        };

        window.startRandomDraw = function() {
            const availableStories = localStories.filter(s => !s.isDrawn);

            if (availableStories.length === 0) {
                if (localStories.length === 0) {
                    alert("접수된 사연이 없습니다!");
                } else {
                    alert("모든 사연이 이미 추첨되었습니다! '추첨 상태 초기화'를 누르면 다시 추첨할 수 있습니다.");
                }
                return;
            }

            const winner = availableStories[Math.floor(Math.random() * availableStories.length)];

            set(currentStateRef, {
                status: 'drawing',
                drawMode: selectedDrawMode,
                winner: null,
                timestamp: Date.now()
            });

            setTimeout(() => {
                update(ref(db, `stories/${winner.id}`), { isDrawn: true });

                set(currentStateRef, {
                    status: 'completed',
                    drawMode: selectedDrawMode,
                    winner: winner,
                    timestamp: Date.now()
                });
            }, 5000);
        };

        function initDisplayMode() {
            let displayInterval = null;

            onValue(currentStateRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const isRecent = data.timestamp && (Date.now() - data.timestamp < 10000);
                const displayBox = document.getElementById('displayBox');

                if (data.status === 'drawing' && isRecent) {
                    if (displayInterval) clearInterval(displayInterval);
                    document.getElementById('displayResultCard').style.display = 'none';
                    displayInterval = runDrawAnimation('displayBox', data.drawMode);
                } else if (data.status === 'completed' && data.winner) {
                    if (displayInterval) clearInterval(displayInterval);

                    const thumbUrl = getYoutubeThumbnail(data.winner.youtubeUrl);

                    // 전광판 화면에 유튜브 썸네일 카드 시각화
                    displayBox.innerHTML = `
                        <a href="${data.winner.youtubeUrl}" target="_blank" style="width:100%; text-decoration:none;">
                            <div class="yt-thumbnail-wrapper" style="height:200px;">
                                <img src="${thumbUrl}" class="yt-thumbnail-img" alt="유튜브 썸네일">
                                <div class="yt-play-overlay">
                                    <i class="fa-brands fa-youtube yt-play-icon" style="font-size:3.8rem;"></i>
                                </div>
                            </div>
                        </a>
                        <div style="font-size:1.5rem; font-weight:bold; color:var(--accent-gold);">✨ 당첨을 축하합니다! ✨</div>
                    `;

                    document.getElementById('displayWinnerUser').innerText = `🎉 ${data.winner.nickname} 님`;
                    document.getElementById('displayWinnerSong').innerText = `🎵 ${data.winner.songTitle}`;
                    document.getElementById('displayWinnerYoutube').href = data.winner.youtubeUrl;
                    document.getElementById('displayResultCard').style.display = 'block';

                    if (isRecent) {
                        confetti({ particleCount: 180, spread: 100, origin: { y: 0.5 } });
                        setTimeout(() => {
                            confetti({ particleCount: 120, angle: 60, spread: 60, origin: { x: 0 } });
                            confetti({ particleCount: 120, angle: 120, spread: 60, origin: { x: 1 } });
                        }, 300);
                    }
                } else {
                    if (displayInterval) clearInterval(displayInterval);
                    displayBox.innerHTML = `
                        <i class="fa-solid fa-tower-broadcast" style="font-size: 3.5rem; color: var(--accent-cyan); margin-bottom: 15px;"></i>
                        <p style="font-size: 1.2rem; font-weight: 700; color: #fff;">보이는 라디오 생방송 중</p>
                        <p style="font-size: 0.9rem; color: var(--text-sub); margin-top: 5px;">사연 추첨을 기다리고 있습니다...</p>
                    `;
                }
            });
        }
    </script>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="on-air-badge">
            <div class="on-air-dot"></div> ON AIR
        </div>
        <h1>사랑부 보이는 라디오</h1>
        <div class="radio-freq">FM 100.4 MHz • LIVE STUDIO</div>
    </div>

    <div class="content">
        <!-- 1. 청취자 화면 -->
        <div id="userSection" class="view-section">
            <form id="storyForm" onsubmit="submitStory(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-user-astronaut"></i> 성함 / 닉네임</label>
                    <input type="text" id="nickname" placeholder="예: 사랑이아빠" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-compact-disc"></i> 신청 찬양 제목</label>
                    <input type="text" id="songTitle" placeholder="예: 은혜 - 손경민" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-brands fa-youtube" style="color:#ff0000;"></i> 유튜브 영상 링크</label>
                    <input type="url" id="youtubeUrl" placeholder="https://youtu.be/..." required>
                </div>
                <button type="submit" class="btn"><i class="fa-solid fa-paper-plane"></i> 사연 및 신청곡 보내기</button>
            </form>

            <div id="submittedCard" style="display: none; text-align: center; padding: 20px 0;">
                <i class="fa-solid fa-circle-check" style="font-size: 3.5rem; color: var(--accent-cyan);"></i>
                <h2 style="margin-top: 15px; color: #fff;">사연이 스튜디오로 전송되었습니다!</h2>
                <p style="color: var(--text-sub); margin-top: 8px; font-size: 0.95rem;">잠시 후 라디오 방송을 기대해 주세요.</p>
                <button class="btn" style="background: rgba(255,255,255,0.1); margin-top:20px; box-shadow:none;" onclick="location.reload()">새 사연 작성</button>
            </div>
        </div>

        <!-- 2. 진행자 제어 및 관리자 화면 -->
        <div id="adminMainSection" class="view-section">
            <div class="draw-mode-select">
                <button class="mode-btn active" onclick="setDrawMode('freq', this)">📻 주파수</button>
                <button class="mode-btn" onclick="setDrawMode('slot', this)">🎰 슬롯머신</button>
                <button class="mode-btn" onclick="setDrawMode('countdown', this)">⏳ 카운트다운(5s)</button>
                <button class="mode-btn" onclick="setDrawMode('vinyl', this)">💿 LP 회전</button>
                <button class="mode-btn" onclick="setDrawMode('radar', this)">⚡ 라이브 스캐너</button>
            </div>

            <div id="adminDisplayBox" class="radio-display-box">
                <i class="fa-solid fa-sliders" style="font-size: 2.2rem; color: var(--accent-pink);"></i>
                <p style="margin-top: 10px; font-size: 1.05rem; font-weight: 600;">메인 DJ 추첨 콘솔</p>
                <p style="color:var(--text-sub); font-size:0.8rem; margin-top:4px;">위 연출을 선택 후 하단 버튼을 클릭하세요 (5초 연출)</p>
            </div>

            <div id="adminResultCard" class="result-card">
                <div id="adminWinnerUser" style="font-size: 1.2rem; font-weight: bold; color: var(--accent-gold);"></div>
                <div id="adminWinnerSong" style="color: #fff; margin-top: 6px;"></div>
                <a id="adminWinnerYoutube" href="#" target="_blank" class="youtube-btn"><i class="fa-brands fa-youtube"></i> 유튜브에서 바로 재생하기</a>
            </div>

            <button class="btn" onclick="startRandomDraw()" style="margin-top: 15px;"><i class="fa-solid fa-dice"></i> 선택한 연출로 추첨 시작 (5초)</button>

            <div class="story-list-container">
                <div class="story-list-header">
                    <span><i class="fa-solid fa-list-check"></i> 접수 사연 목록 (<span id="undrawnCount" style="color:var(--accent-gold);">0</span>/<span id="storyCount">0</span>)</span>
                    <button style="background:none; border:none; color:var(--text-sub); font-size:0.75rem; cursor:pointer; text-decoration:underline;" onclick="resetDrawnStatus()">추첨 상태 초기화</button>
                </div>
                <div id="adminStoryList">
                </div>
            </div>
        </div>

        <!-- 3. 전광판 화면 -->
        <div id="displaySection" class="view-section">
            <div id="displayBox" class="radio-display-box">
                <i class="fa-solid fa-tower-broadcast" style="font-size: 3.5rem; color: var(--accent-cyan); margin-bottom: 15px;"></i>
                <p style="font-size: 1.2rem; font-weight: 700; color: #fff;">보이는 라디오 생방송 중</p>
                <p style="font-size: 0.9rem; color: var(--text-sub); margin-top: 5px;">사연 추첨을 기다리고 있습니다...</p>
            </div>

            <div id="displayResultCard" class="result-card" style="padding: 20px;">
                <div id="displayWinnerUser" style="font-size: 1.6rem; font-weight: bold; color: var(--accent-gold);"></div>
                <div id="displayWinnerSong" style="color: #fff; margin-top: 8px; font-size: 1.1rem;"></div>
                <a id="displayWinnerYoutube" href="#" target="_blank" class="youtube-btn" style="margin-top: 15px;"><i class="fa-brands fa-youtube"></i> 유튜브 영상 보기</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
